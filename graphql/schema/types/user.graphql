enum RoleEnum {
  "Everything, including deleting, merging, configuration and tasks"
  ADMIN
  "Browse and play content, and record their own viewing activity"
  READ
  "READ, plus create and edit library metadata"
  MODIFY
}

"""
Restricts the field to users with the given role. On an input field, sending
the field requires the role.
Mutations without this directive are restricted to the ADMIN role.
"""
directive @hasRole(role: RoleEnum!) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION
directive @isUserOwner on FIELD_DEFINITION

type User {
  name: String!
  """
  If the user has no roles, they are considered locked and cannot log in.
  Should not be visible to other users
  """
  roles: [RoleEnum!] @isUserOwner
  """
  If true, requests from the local network without a session are logged in as
  this user. At most one user has auto login.
  """
  autoLogin: Boolean!
  """
  False if the user has no password and can only be logged in automatically.
  Such a user keeps auto login until a password is set.
  """
  hasPassword: Boolean!
}

input UserCreateInput {
  name: String!
  """
  Password in plain text
  """
  password: String!
  roles: [RoleEnum!]!
  "Setting auto login for this user clears it for every other user"
  autoLogin: Boolean
}

input UserUpdateInput {
  existingName: String!
  name: String!
  roles: [RoleEnum!]!
  """
  Setting auto login for this user clears it for every other user.
  Left unchanged if not set.
  """
  autoLogin: Boolean
}

input UserDestroyInput {
  name: String!
}

input UserChangePasswordInput {
  """
  Password in plain text. Not checked for a user without a password.
  """
  existingPassword: String!
  newPassword: String!
}

input ChangeUserPasswordInput {
  name: String!
  newPassword: String!
}
