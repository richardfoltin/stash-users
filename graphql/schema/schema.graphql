"The query root for this schema"
type Query {
  # Filters
  findSavedFilter(id: ID!): SavedFilter
  findSavedFilters(mode: FilterMode): [SavedFilter!]!
  findDefaultFilter(mode: FilterMode!): SavedFilter
    @deprecated(reason: "default filter now stored in UI config")

  "Find a file by its id or path"
  findFile(id: ID, path: String): BaseFile!

  "Queries for Files"
  findFiles(
    file_filter: FileFilterType
    filter: FindFilterType
    ids: [ID!]
  ): FindFilesResultType!

  "Find a file by its id or path"
  findFolder(id: ID, path: String): Folder!

  "Queries for Files"
  findFolders(
    folder_filter: FolderFilterType
    filter: FindFilterType
    ids: [ID!]
  ): FindFoldersResultType!

  "Find a scene by ID or Checksum"
  findScene(id: ID, checksum: String): Scene
  findSceneByHash(input: SceneHashInput!): Scene

  "A function which queries Scene objects"
  findScenes(
    scene_filter: SceneFilterType
    scene_ids: [Int!] @deprecated(reason: "use ids")
    ids: [ID!]
    filter: FindFilterType
  ): FindScenesResultType!

  findScenesByPathRegex(filter: FindFilterType): FindScenesResultType!

  """
  Returns any groups of scenes that are perceptual duplicates within the queried distance
  and the difference between their duration is smaller than durationDiff
  """
  findDuplicateScenes(
    distance: Int
    """
    Max difference in seconds between files in order to be considered for similarity matching.
    Fractional seconds are ok: 0.5 will mean only files that have durations within 0.5 seconds between them will be matched based on PHash distance.
    """
    duration_diff: Float
    scene_filter: SceneFilterType
  ): [[Scene!]!]!

  "Return valid stream paths"
  sceneStreams(id: ID): [SceneStreamEndpoint!]!

  parseSceneFilenames(
    filter: FindFilterType
    config: SceneParserInput!
  ): SceneParserResultType!

  "A function which queries SceneMarker objects"
  findSceneMarkers(
    scene_marker_filter: SceneMarkerFilterType
    filter: FindFilterType
    ids: [ID!]
  ): FindSceneMarkersResultType!

  findImage(id: ID, checksum: String): Image

  "A function which queries Scene objects"
  findImages(
    image_filter: ImageFilterType
    image_ids: [Int!] @deprecated(reason: "use ids")
    ids: [ID!]
    filter: FindFilterType
  ): FindImagesResultType!

  "Find a performer by ID"
  findPerformer(id: ID!): Performer
  "A function which queries Performer objects"
  findPerformers(
    performer_filter: PerformerFilterType
    filter: FindFilterType
    performer_ids: [Int!] @deprecated(reason: "use ids")
    ids: [ID!]
  ): FindPerformersResultType!

  "Find a studio by ID"
  findStudio(id: ID!): Studio
  "A function which queries Studio objects"
  findStudios(
    studio_filter: StudioFilterType
    filter: FindFilterType
    ids: [ID!]
  ): FindStudiosResultType!

  "Find a movie by ID"
  findMovie(id: ID!): Movie @deprecated(reason: "Use findGroup instead")
  "A function which queries Movie objects"
  findMovies(
    movie_filter: MovieFilterType
    filter: FindFilterType
    ids: [ID!]
  ): FindMoviesResultType! @deprecated(reason: "Use findGroups instead")

  "Find a group by ID"
  findGroup(id: ID!): Group
  "A function which queries Group objects"
  findGroups(
    group_filter: GroupFilterType
    filter: FindFilterType
    ids: [ID!]
  ): FindGroupsResultType!

  findGallery(id: ID!): Gallery
  findGalleries(
    gallery_filter: GalleryFilterType
    filter: FindFilterType
    ids: [ID!]
  ): FindGalleriesResultType!

  findTag(id: ID!): Tag
  findTags(
    tag_filter: TagFilterType
    filter: FindFilterType
    ids: [ID!]
  ): FindTagsResultType!

  "Retrieve random scene markers for the wall"
  markerWall(q: String): [SceneMarker!]!
  "Retrieve random scenes for the wall"
  sceneWall(q: String): [Scene!]!

  "Get marker strings"
  markerStrings(q: String, sort: String): [MarkerStringsResultType]!
  "Get stats"
  stats: StatsResultType!
  "Organize scene markers by tag for a given scene ID"
  sceneMarkerTags(scene_id: ID!): [SceneMarkerTag!]!

  logs: [LogEntry!]! @adminOnly

  # Scrapers

  "List available scrapers"
  listScrapers(types: [ScrapeContentType!]!): [Scraper!]!

  "Scrape for a single scene"
  scrapeSingleScene(
    source: ScraperSourceInput!
    input: ScrapeSingleSceneInput!
  ): [ScrapedScene!]! @hasPermission(permission: USE_SCRAPERS)
  "Scrape for multiple scenes"
  scrapeMultiScenes(
    source: ScraperSourceInput!
    input: ScrapeMultiScenesInput!
  ): [[ScrapedScene!]!]! @hasPermission(permission: USE_SCRAPERS)

  "Scrape for a single studio"
  scrapeSingleStudio(
    source: ScraperSourceInput!
    input: ScrapeSingleStudioInput!
  ): [ScrapedStudio!]! @hasPermission(permission: USE_SCRAPERS)

  "Scrape for a single tag"
  scrapeSingleTag(
    source: ScraperSourceInput!
    input: ScrapeSingleTagInput!
  ): [ScrapedTag!]! @hasPermission(permission: USE_SCRAPERS)

  "Scrape for a single performer"
  scrapeSinglePerformer(
    source: ScraperSourceInput!
    input: ScrapeSinglePerformerInput!
  ): [ScrapedPerformer!]! @hasPermission(permission: USE_SCRAPERS)
  "Scrape for multiple performers"
  scrapeMultiPerformers(
    source: ScraperSourceInput!
    input: ScrapeMultiPerformersInput!
  ): [[ScrapedPerformer!]!]! @hasPermission(permission: USE_SCRAPERS)

  "Scrape for a single gallery"
  scrapeSingleGallery(
    source: ScraperSourceInput!
    input: ScrapeSingleGalleryInput!
  ): [ScrapedGallery!]! @hasPermission(permission: USE_SCRAPERS)

  "Scrape for a single movie"
  scrapeSingleMovie(
    source: ScraperSourceInput!
    input: ScrapeSingleMovieInput!
  ): [ScrapedMovie!]! @deprecated(reason: "Use scrapeSingleGroup instead")
    @hasPermission(permission: USE_SCRAPERS)

  "Scrape for a single group"
  scrapeSingleGroup(
    source: ScraperSourceInput!
    input: ScrapeSingleGroupInput!
  ): [ScrapedGroup!]! @hasPermission(permission: USE_SCRAPERS)

  "Scrape for a single image"
  scrapeSingleImage(
    source: ScraperSourceInput!
    input: ScrapeSingleImageInput!
  ): [ScrapedImage!]! @hasPermission(permission: USE_SCRAPERS)

  "Scrapes content based on a URL"
  scrapeURL(url: String!, ty: ScrapeContentType!): ScrapedContent
    @hasPermission(permission: USE_SCRAPERS)

  "Scrapes a complete performer record based on a URL"
  scrapePerformerURL(url: String!): ScrapedPerformer @hasPermission(permission: USE_SCRAPERS)
  "Scrapes a complete scene record based on a URL"
  scrapeSceneURL(url: String!): ScrapedScene @hasPermission(permission: USE_SCRAPERS)
  "Scrapes a complete gallery record based on a URL"
  scrapeGalleryURL(url: String!): ScrapedGallery @hasPermission(permission: USE_SCRAPERS)
  "Scrapes a complete image record based on a URL"
  scrapeImageURL(url: String!): ScrapedImage @hasPermission(permission: USE_SCRAPERS)
  "Scrapes a complete movie record based on a URL"
  scrapeMovieURL(url: String!): ScrapedMovie
    @deprecated(reason: "Use scrapeGroupURL instead")
    @hasPermission(permission: USE_SCRAPERS)
  "Scrapes a complete group record based on a URL"
  scrapeGroupURL(url: String!): ScrapedGroup @hasPermission(permission: USE_SCRAPERS)

  # Plugins
  "List loaded plugins"
  plugins: [Plugin!]
  "List available plugin operations"
  pluginTasks: [PluginTask!]

  # Packages
  "List installed packages"
  installedPackages(type: PackageType!): [Package!]! @adminOnly
  "List available packages"
  availablePackages(type: PackageType!, source: String!): [Package!]!
    @adminOnly

  # Config
  "Returns the current, complete configuration"
  configuration: ConfigResult!
  "Returns an array of paths for the given path"
  directory(
    "The directory path to list"
    path: String
    "Desired collation locale. Determines the order of the directory result. eg. 'en-US', 'pt-BR', ..."
    locale: String = "en"
  ): Directory! @adminOnly
  validateStashBoxCredentials(input: StashBoxInput!): StashBoxValidationResult!
    @adminOnly

  # System status
  systemStatus: SystemStatus!

  # Job status
  jobQueue: [Job!]
  findJob(input: FindJobInput!): Job

  dlnaStatus: DLNAStatus!

  # Get everything

  allScenes: [Scene!]! @deprecated(reason: "Use findScenes instead")
  allSceneMarkers: [SceneMarker!]!
    @deprecated(reason: "Use findSceneMarkers instead")
  allImages: [Image!]! @deprecated(reason: "Use findImages instead")
  allGalleries: [Gallery!]! @deprecated(reason: "Use findGalleries instead")

  allPerformers: [Performer!]!
  allTags: [Tag!]! @deprecated(reason: "Use findTags instead")
  allStudios: [Studio!]! @deprecated(reason: "Use findStudios instead")
  allMovies: [Movie!]! @deprecated(reason: "Use findGroups instead")

  # Get everything with minimal metadata

  # Users
  "List all users"
  users: [User!]! @adminOnly
  "List all roles: the Admin role first"
  roles: [Role!]! @adminOnly
  """
  Returns currently authenticated user.
  Returns null if no users are configured and authentication is not required.
  """
  me: User

  # Version
  version: Version!

  # LatestVersion
  latestversion: LatestVersion!
}

type Mutation {
  setup(input: SetupInput!): Boolean! @adminOnly

  "Migrates the schema to the required version. Returns the job ID"
  migrate(input: MigrateInput!): ID! @adminOnly

  "Downloads and installs ffmpeg and ffprobe binaries into the configuration directory. Returns the job ID."
  downloadFFMpeg: ID! @adminOnly

  sceneCreate(input: SceneCreateInput!): Scene @hasPermission(permission: SCENES_EDIT)
  sceneUpdate(input: SceneUpdateInput!): Scene @hasPermission(permission: SCENES_EDIT)
  sceneMerge(input: SceneMergeInput!): Scene @hasPermission(permission: SCENES_MERGE)
  bulkSceneUpdate(input: BulkSceneUpdateInput!): [Scene!] @hasPermission(permission: SCENES_EDIT)
  sceneDestroy(input: SceneDestroyInput!): Boolean! @hasPermission(permission: SCENES_DELETE)
  scenesDestroy(input: ScenesDestroyInput!): Boolean! @hasPermission(permission: SCENES_DELETE)
  scenesUpdate(input: [SceneUpdateInput!]!): [Scene] @hasPermission(permission: SCENES_EDIT)

  "Increments the o-counter for a scene. Returns the new value"
  sceneIncrementO(id: ID!): Int! @deprecated(reason: "Use sceneAddO instead")
    @hasPermission(permission: RECORD_ACTIVITY)
  "Decrements the o-counter for a scene. Returns the new value"
  sceneDecrementO(id: ID!): Int! @deprecated(reason: "Use sceneRemoveO instead")
    @hasPermission(permission: RECORD_ACTIVITY)

  "Increments the o-counter for a scene. Uses the current time if none provided."
  sceneAddO(id: ID!, times: [Timestamp!]): HistoryMutationResult!
    @hasPermission(permission: RECORD_ACTIVITY)
  "Decrements the o-counter for a scene, removing the last recorded time if specific time not provided. Returns the new value"
  sceneDeleteO(id: ID!, times: [Timestamp!]): HistoryMutationResult!
    @hasPermission(permission: RECORD_ACTIVITY)

  "Resets the o-counter for a scene to 0. Returns the new value"
  sceneResetO(id: ID!): Int! @hasPermission(permission: RECORD_ACTIVITY)

  "Sets the resume time point (if provided) and adds the provided duration to the scene's play duration"
  sceneSaveActivity(id: ID!, resume_time: Float, playDuration: Float): Boolean!
    @hasPermission(permission: RECORD_ACTIVITY)

  "Resets the resume time point and play duration"
  sceneResetActivity(
    id: ID!
    reset_resume: Boolean
    reset_duration: Boolean
  ): Boolean! @hasPermission(permission: RECORD_ACTIVITY)

  "Increments the play count for the scene. Returns the new play count value."
  sceneIncrementPlayCount(id: ID!): Int!
    @deprecated(reason: "Use sceneAddPlay instead")
    @hasPermission(permission: RECORD_ACTIVITY)

  "Increments the play count for the scene. Uses the current time if none provided."
  sceneAddPlay(id: ID!, times: [Timestamp!]): HistoryMutationResult!
    @hasPermission(permission: RECORD_ACTIVITY)
  "Decrements the play count for the scene, removing the specific times or the last recorded time if not provided."
  sceneDeletePlay(id: ID!, times: [Timestamp!]): HistoryMutationResult!
    @hasPermission(permission: RECORD_ACTIVITY)
  "Resets the play count for a scene to 0. Returns the new play count value."
  sceneResetPlayCount(id: ID!): Int! @hasPermission(permission: RECORD_ACTIVITY)

  "Generates screenshot at specified time in seconds. Leave empty to generate default screenshot"
  sceneGenerateScreenshot(id: ID!, at: Float): ID! @hasPermission(permission: SCENES_EDIT)

  sceneMarkerCreate(input: SceneMarkerCreateInput!): SceneMarker
    @hasPermission(permission: MARKERS_EDIT)
  sceneMarkerUpdate(input: SceneMarkerUpdateInput!): SceneMarker
    @hasPermission(permission: MARKERS_EDIT)
  bulkSceneMarkerUpdate(input: BulkSceneMarkerUpdateInput!): [SceneMarker!]
    @hasPermission(permission: MARKERS_EDIT)
  sceneMarkerDestroy(id: ID!): Boolean! @hasPermission(permission: MARKERS_DELETE)
  sceneMarkersDestroy(ids: [ID!]!): Boolean! @hasPermission(permission: MARKERS_DELETE)

  sceneAssignFile(input: AssignSceneFileInput!): Boolean! @hasPermission(permission: MANAGE_FILES)

  imageUpdate(input: ImageUpdateInput!): Image @hasPermission(permission: IMAGES_EDIT)
  bulkImageUpdate(input: BulkImageUpdateInput!): [Image!] @hasPermission(permission: IMAGES_EDIT)
  imageDestroy(input: ImageDestroyInput!): Boolean! @hasPermission(permission: IMAGES_DELETE)
  imagesDestroy(input: ImagesDestroyInput!): Boolean! @hasPermission(permission: IMAGES_DELETE)
  imagesUpdate(input: [ImageUpdateInput!]!): [Image] @hasPermission(permission: IMAGES_EDIT)

  "Increments the o-counter for an image. Returns the new value"
  imageIncrementO(id: ID!): Int! @hasPermission(permission: RECORD_ACTIVITY)
  "Decrements the o-counter for an image. Returns the new value"
  imageDecrementO(id: ID!): Int! @hasPermission(permission: RECORD_ACTIVITY)
  "Resets the o-counter for a image to 0. Returns the new value"
  imageResetO(id: ID!): Int! @hasPermission(permission: RECORD_ACTIVITY)

  galleryCreate(input: GalleryCreateInput!): Gallery @hasPermission(permission: GALLERIES_EDIT)
  galleryUpdate(input: GalleryUpdateInput!): Gallery @hasPermission(permission: GALLERIES_EDIT)
  bulkGalleryUpdate(input: BulkGalleryUpdateInput!): [Gallery!]
    @hasPermission(permission: GALLERIES_EDIT)
  galleryDestroy(input: GalleryDestroyInput!): Boolean! @hasPermission(permission: GALLERIES_DELETE)
  galleriesUpdate(input: [GalleryUpdateInput!]!): [Gallery]
    @hasPermission(permission: GALLERIES_EDIT)

  addGalleryImages(input: GalleryAddInput!): Boolean! @hasPermission(permission: GALLERIES_EDIT)
  removeGalleryImages(input: GalleryRemoveInput!): Boolean!
    @hasPermission(permission: GALLERIES_EDIT)
  setGalleryCover(input: GallerySetCoverInput!): Boolean! @hasPermission(permission: GALLERIES_EDIT)
  resetGalleryCover(input: GalleryResetCoverInput!): Boolean!
    @hasPermission(permission: GALLERIES_EDIT)

  galleryChapterCreate(input: GalleryChapterCreateInput!): GalleryChapter
    @hasPermission(permission: CHAPTERS_EDIT)
  galleryChapterUpdate(input: GalleryChapterUpdateInput!): GalleryChapter
    @hasPermission(permission: CHAPTERS_EDIT)
  galleryChapterDestroy(id: ID!): Boolean! @hasPermission(permission: CHAPTERS_DELETE)

  performerCreate(input: PerformerCreateInput!): Performer
    @hasPermission(permission: PERFORMERS_EDIT)
  performerUpdate(input: PerformerUpdateInput!): Performer
    @hasPermission(permission: PERFORMERS_EDIT)
  performerDestroy(input: PerformerDestroyInput!): Boolean!
    @hasPermission(permission: PERFORMERS_DELETE)
  performersDestroy(ids: [ID!]!): Boolean! @hasPermission(permission: PERFORMERS_DELETE)
  bulkPerformerUpdate(input: BulkPerformerUpdateInput!): [Performer!]
    @hasPermission(permission: PERFORMERS_EDIT)
  performerMerge(input: PerformerMergeInput!): Performer! @hasPermission(permission: PERFORMERS_MERGE)

  studioCreate(input: StudioCreateInput!): Studio @hasPermission(permission: STUDIOS_EDIT)
  studioUpdate(input: StudioUpdateInput!): Studio @hasPermission(permission: STUDIOS_EDIT)
  studioDestroy(input: StudioDestroyInput!): Boolean! @hasPermission(permission: STUDIOS_DELETE)
  studiosDestroy(ids: [ID!]!): Boolean! @hasPermission(permission: STUDIOS_DELETE)
  bulkStudioUpdate(input: BulkStudioUpdateInput!): [Studio!]
    @hasPermission(permission: STUDIOS_EDIT)

  movieCreate(input: MovieCreateInput!): Movie
    @deprecated(reason: "Use groupCreate instead")
    @hasPermission(permission: GROUPS_EDIT)
  movieUpdate(input: MovieUpdateInput!): Movie
    @deprecated(reason: "Use groupUpdate instead")
    @hasPermission(permission: GROUPS_EDIT)
  movieDestroy(input: MovieDestroyInput!): Boolean!
    @deprecated(reason: "Use groupDestroy instead")
    @hasPermission(permission: GROUPS_DELETE)
  moviesDestroy(ids: [ID!]!): Boolean!
    @deprecated(reason: "Use groupsDestroy instead")
    @hasPermission(permission: GROUPS_DELETE)
  bulkMovieUpdate(input: BulkMovieUpdateInput!): [Movie!]
    @deprecated(reason: "Use bulkGroupUpdate instead")
    @hasPermission(permission: GROUPS_EDIT)

  groupCreate(input: GroupCreateInput!): Group @hasPermission(permission: GROUPS_EDIT)
  groupUpdate(input: GroupUpdateInput!): Group @hasPermission(permission: GROUPS_EDIT)
  groupDestroy(input: GroupDestroyInput!): Boolean! @hasPermission(permission: GROUPS_DELETE)
  groupsDestroy(ids: [ID!]!): Boolean! @hasPermission(permission: GROUPS_DELETE)
  bulkGroupUpdate(input: BulkGroupUpdateInput!): [Group!] @hasPermission(permission: GROUPS_EDIT)

  addGroupSubGroups(input: GroupSubGroupAddInput!): Boolean!
    @hasPermission(permission: GROUPS_EDIT)
  removeGroupSubGroups(input: GroupSubGroupRemoveInput!): Boolean!
    @hasPermission(permission: GROUPS_EDIT)

  "Reorder sub groups within a group. Returns true if successful."
  reorderSubGroups(input: ReorderSubGroupsInput!): Boolean!
    @hasPermission(permission: GROUPS_EDIT)

  tagCreate(input: TagCreateInput!): Tag @hasPermission(permission: TAGS_EDIT)
  tagUpdate(input: TagUpdateInput!): Tag @hasPermission(permission: TAGS_EDIT)
  tagDestroy(input: TagDestroyInput!): Boolean! @hasPermission(permission: TAGS_DELETE)
  tagsDestroy(ids: [ID!]!): Boolean! @hasPermission(permission: TAGS_DELETE)
  tagsMerge(input: TagsMergeInput!): Tag @hasPermission(permission: TAGS_MERGE)
  bulkTagUpdate(input: BulkTagUpdateInput!): [Tag!] @hasPermission(permission: TAGS_EDIT)

  """
  Moves the given files to the given destination. Returns true if successful.
  Either the destination_folder or destination_folder_id must be provided.
  If both are provided, the destination_folder_id takes precedence.
  Destination folder must be a subfolder of one of the stash library paths.
  If provided, destination_basename must be a valid filename with an extension that
  matches one of the media extensions.
  Creates folder hierarchy if needed.
  """
  moveFiles(input: MoveFilesInput!): Boolean! @hasPermission(permission: MANAGE_FILES)
  deleteFiles(ids: [ID!]!): Boolean! @hasPermission(permission: MANAGE_FILES)
  "Deletes file entries from the database without deleting the files from the filesystem"
  destroyFiles(ids: [ID!]!): Boolean! @hasPermission(permission: MANAGE_FILES)

  fileSetFingerprints(input: FileSetFingerprintsInput!): Boolean!
    @hasPermission(permission: MANAGE_FILES)
  "Reveal the file in the system file manager"
  revealFileInFileManager(id: ID!): Boolean! @hasPermission(permission: MANAGE_FILES)
  "Reveal the folder in the system file manager"
  revealFolderInFileManager(id: ID!): Boolean! @hasPermission(permission: MANAGE_FILES)

  # Saved filters
  saveFilter(input: SaveFilterInput!): SavedFilter! @hasPermission(permission: SAVE_FILTERS)
  destroySavedFilter(input: DestroyFilterInput!): Boolean! @hasPermission(permission: DELETE_SAVED_FILTERS)
  setDefaultFilter(input: SetDefaultFilterInput!): Boolean!
    @deprecated(reason: "now uses UI config")
    @hasPermission(permission: MANAGE_SHARED_LIST_SETTINGS)

  "Change general configuration options"
  configureGeneral(input: ConfigGeneralInput!): ConfigGeneralResult!
    @adminOnly
  configureInterface(input: ConfigInterfaceInput!): ConfigInterfaceResult!
    @adminOnly
  configureDLNA(input: ConfigDLNAInput!): ConfigDLNAResult!
    @adminOnly
  configureScraping(input: ConfigScrapingInput!): ConfigScrapingResult!
    @adminOnly
  configureDefaults(
    input: ConfigDefaultSettingsInput!
  ): ConfigDefaultSettingsResult! @adminOnly

  "overwrites the entire plugin configuration for the given plugin"
  configurePlugin(plugin_id: ID!, input: Map!): Map! @adminOnly

  """
  overwrites the UI configuration
  if input is provided, then the entire UI configuration is replaced
  if partial is provided, then the partial UI configuration is merged into the existing UI configuration
  """
  configureUI(input: Map, partial: Map): Map! @hasPermission(permission: MANAGE_SHARED_LIST_SETTINGS)
  """
  sets a single UI key value
  key is a dot separated path to the value
  """
  configureUISetting(key: String!, value: Any): Map! @hasPermission(permission: MANAGE_SHARED_LIST_SETTINGS)

  "Generate and set (or clear) API key"
  generateAPIKey(input: GenerateAPIKeyInput!): String! @adminOnly

  "Returns a link to download the result"
  exportObjects(input: ExportObjectsInput!): String @adminOnly

  "Performs an incremental import. Returns the job ID"
  importObjects(input: ImportObjectsInput!): ID! @adminOnly

  "Start an full import. Completely wipes the database and imports from the metadata directory. Returns the job ID"
  metadataImport: ID! @adminOnly
  "Start a full export. Outputs to the metadata directory. Returns the job ID"
  metadataExport: ID! @adminOnly
  "Start a scan. Returns the job ID"
  metadataScan(input: ScanMetadataInput!): ID! @hasPermission(permission: RUN_LIBRARY_TASKS)
  "Start generating content. Returns the job ID"
  metadataGenerate(input: GenerateMetadataInput!): ID! @hasPermission(permission: RUN_LIBRARY_TASKS)
  "Start auto-tagging. Returns the job ID"
  metadataAutoTag(input: AutoTagMetadataInput!): ID! @hasPermission(permission: RUN_LIBRARY_TASKS)
  "Clean metadata. Returns the job ID"
  metadataClean(input: CleanMetadataInput!): ID! @hasPermission(permission: RUN_LIBRARY_TASKS)
  "Clean generated files. Returns the job ID"
  metadataCleanGenerated(input: CleanGeneratedInput!): ID! @hasPermission(permission: RUN_LIBRARY_TASKS)
  "Identifies scenes using scrapers. Returns the job ID"
  metadataIdentify(input: IdentifyMetadataInput!): ID! @hasPermission(permission: RUN_LIBRARY_TASKS)

  "Migrate generated files for the current hash naming"
  migrateHashNaming: ID! @adminOnly
  "Migrates legacy scene screenshot files into the blob storage"
  migrateSceneScreenshots(input: MigrateSceneScreenshotsInput!): ID!
    @adminOnly
  "Migrates blobs from the old storage system to the current one"
  migrateBlobs(input: MigrateBlobsInput!): ID! @adminOnly

  "Anonymise the database in a separate file. Optionally returns a link to download the database file"
  anonymiseDatabase(input: AnonymiseDatabaseInput!): String
    @adminOnly

  "Optimises the database. Returns the job ID"
  optimiseDatabase: ID! @adminOnly

  "Reload scrapers"
  reloadScrapers: Boolean! @adminOnly

  """
  Enable/disable plugins - enabledMap is a map of plugin IDs to enabled booleans.
  Plugins not in the map are not affected.
  """
  setPluginsEnabled(enabledMap: BoolMap!): Boolean! @adminOnly

  """
  Run a plugin task.
  If task_name is provided, then the task must exist in the plugin config and the tasks configuration
  will be used to run the plugin.
  If no task_name is provided, then the plugin will be executed with the arguments provided only.
  Returns the job ID
  """
  runPluginTask(
    plugin_id: ID!
    "if provided, then the default args will be applied"
    task_name: String
    "displayed in the task queue"
    description: String
    args: [PluginArgInput!] @deprecated(reason: "Use args_map instead")
    args_map: Map
  ): ID! @adminOnly

  """
  Runs a plugin operation. The operation is run immediately and does not use the job queue.
  Returns a map of the result.
  """
  runPluginOperation(plugin_id: ID!, args: Map): Any @adminOnly

  reloadPlugins: Boolean! @adminOnly

  """
  Installs the given packages.
  If a package is already installed, it will be updated if needed..
  If an error occurs when installing a package, the job will continue to install the remaining packages.
  Returns the job ID
  """
  installPackages(type: PackageType!, packages: [PackageSpecInput!]!): ID!
    @adminOnly
  """
  Updates the given packages.
  If a package is not installed, it will not be installed.
  If a package does not need to be updated, it will not be updated.
  If no packages are provided, all packages of the given type will be updated.
  If an error occurs when updating a package, the job will continue to update the remaining packages.
  Returns the job ID.
  """
  updatePackages(type: PackageType!, packages: [PackageSpecInput!]): ID!
    @adminOnly
  """
  Uninstalls the given packages.
  If an error occurs when uninstalling a package, the job will continue to uninstall the remaining packages.
  Returns the job ID
  """
  uninstallPackages(type: PackageType!, packages: [PackageSpecInput!]!): ID!
    @adminOnly

  stopJob(job_id: ID!): Boolean! @hasPermission(permission: RUN_LIBRARY_TASKS)
  stopAllJobs: Boolean! @hasPermission(permission: RUN_LIBRARY_TASKS)

  "Submit fingerprints to stash-box instance"
  submitStashBoxFingerprints(
    input: StashBoxFingerprintSubmissionInput!
  ): Boolean! @adminOnly

  "Submit scene as draft to stash-box instance"
  submitStashBoxSceneDraft(input: StashBoxDraftSubmissionInput!): ID
    @adminOnly
  "Submit performer as draft to stash-box instance"
  submitStashBoxPerformerDraft(input: StashBoxDraftSubmissionInput!): ID
    @adminOnly

  "Backup the database. Optionally returns a link to download the database file"
  backupDatabase(input: BackupDatabaseInput!): String @adminOnly

  "DANGEROUS: Execute an arbitrary SQL statement that returns rows."
  querySQL(sql: String!, args: [Any]): SQLQueryResult! @adminOnly

  "DANGEROUS: Execute an arbitrary SQL statement without returning any rows."
  execSQL(sql: String!, args: [Any]): SQLExecResult! @adminOnly

  "Run batch performer tag task. Returns the job ID."
  stashBoxBatchPerformerTag(input: StashBoxBatchTagInput!): String!
    @adminOnly
  "Run batch studio tag task. Returns the job ID."
  stashBoxBatchStudioTag(input: StashBoxBatchTagInput!): String!
    @adminOnly
  "Run batch tag tag task. Returns the job ID."
  stashBoxBatchTagTag(input: StashBoxBatchTagInput!): String!
    @adminOnly

  "Enables DLNA for an optional duration. Has no effect if DLNA is enabled by default"
  enableDLNA(input: EnableDLNAInput!): Boolean! @adminOnly
  "Disables DLNA for an optional duration. Has no effect if DLNA is disabled by default"
  disableDLNA(input: DisableDLNAInput!): Boolean! @adminOnly
  "Enables an IP address for DLNA for an optional duration"
  addTempDLNAIP(input: AddTempDLNAIPInput!): Boolean! @adminOnly
  "Removes an IP address from the temporary DLNA whitelist"
  removeTempDLNAIP(input: RemoveTempDLNAIPInput!): Boolean!
    @adminOnly

  # Users
  "Creates a user. The first user must have the ADMIN role"
  userCreate(input: UserCreateInput!): User @adminOnly
  "Sets the name, role and auto login of a user. The last admin keeps the Admin role"
  userUpdate(input: UserUpdateInput!): User @adminOnly
  "Deletes a user. The last admin cannot be deleted"
  userDestroy(input: UserDestroyInput!): Boolean! @adminOnly
  "Sets the password of the given user"
  changeUserPassword(input: ChangeUserPasswordInput!): Boolean!
    @adminOnly
  "Changes the password of the current user"
  changePassword(input: UserChangePasswordInput!): Boolean!
    @signedIn

  "Creates a role. Role names are unique, ignoring case"
  roleCreate(input: RoleCreateInput!): Role! @adminOnly
  "Sets the name, description and permissions of a role. The Admin role cannot be changed"
  roleUpdate(input: RoleUpdateInput!): Role! @adminOnly
  "Deletes a role. A role that users have, and the Admin role, cannot be deleted"
  roleDestroy(input: RoleDestroyInput!): Boolean! @adminOnly
}

type Subscription {
  "Update from the metadata manager"
  jobsSubscribe: JobStatusUpdate!

  loggingSubscribe: [LogEntry!]! @adminOnly

  scanCompleteSubscribe: Boolean!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
